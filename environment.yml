name: mrmem
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10.12

  # PyTorch with CUDA 12.1
  - pytorch=2.5.1
  - pytorch-cuda=12.1

  # Core ML libraries
  - numpy=1.24.3
  - scipy=1.11.3
  - scikit-learn=1.3.1
  - pandas=2.0.3

  # Development tools
  - pip=23.3
  - setuptools=68.2.2
  - wheel=0.41.3

  # Utilities
  - tqdm=4.66.4
  - pyyaml=6.0.1
  - jinja2=3.1.2

  # pip packages (not available in conda)
  - pip:
    - transformers==5.12.1
    - accelerate==1.1.0
    - deepspeed==0.16.4
    - safetensors==0.4.3
    - tokenizers==0.22.1
    - sentencepiece==0.1.99
    - protobuf==3.20.3
    - datasets==4.5.0
    - faiss-cpu==1.7.4
    - rank-bm25==0.2.2
    - rouge-score==0.1.2
    - pytest==7.4.3
    - black==23.11.0
    - flake8==6.1.0

# Installation:
# conda env create -f environment.yml
# conda activate mrmem

# For GPU support, ensure CUDA 12.1 is installed on the system
# Verify installation: python -c "import torch; print(torch.cuda.is_available())"
